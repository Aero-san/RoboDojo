# G05 RECAP with RoboDojo trajectory HDF5 demonstrations and remote rollout.
schema_version: 2

policy:
  name: g05

run:
  task: pour_by_language
  output_root: outputs/recap_g05_hdf5_remote
  iterations: 10
  resume: false
  reuse_completed_artifacts: false
  seed: 0

environment:
  env_cfg: arx_x5
  action_type: joint
  policy_env: /share/mingyang/RoboDojo/XPolicyLab/policy/G05/GalaxeaVLA/.venv
  eval_env: /mnt/cpfs-E/mingyang/miniconda3/envs/RoboDojo

checkpoints:
  initial_policy: XPolicyLab/policy/G05/checkpoints/hf_g05_robodojo_fm_only_checkpoint
  initial_wcm: outputs/wcm/robodojo_pi05/deploy.pt

data:
  # Exactly one source adapter is selected for the run. The task is discovered
  # below data/RoboDojo/<run.task>/<environment.env_cfg>/data.
  format: hdf5
  demo_root: data/RoboDojo
  max_demo_episodes: 0
  mode: video
  norm_asset_id: null

devices:
  policy_train: [4, 5, 6, 7]
  wcm_train: [4, 5, 6, 7]
  rollout_policy: 4
  rollout_environment: 5
  value_video: 4
  reservation:
    enabled: true
    leave_free_mib: 2048
    idle_used_max_mib: 1024
    local_max_hold_seconds: 1800
    remote_max_hold_seconds: 1800

rollout:
  episodes: 30
  max_steps: 40
  # Continue successful/failed simulations until max_steps so RECAP videos
  # and trajectories have a fixed temporal horizon.
  fixed_horizon: true
  layout_seed: 0
  minimum:
    total: 20
    successes: 3
    failures: 3
  remote:
    enabled: true
    host: XYZ4090
    repo_root: /share/mingyang/RoboDojo
    work_root: /share/mingyang/recap_remote_jobs
    zstd: /usr/bin/zstd
    conda: /share/mingyang/miniconda3/bin/conda
    python: /share/mingyang/miniconda3/envs/RoboDojo/bin/python
    policy_env: /share/mingyang/RoboDojo/XPolicyLab/policy/G05/GalaxeaVLA/.venv
    eval_env: /share/mingyang/miniconda3/envs/RoboDojo
    policy_gpu: 0
    environment_gpu: 1
    value_video_gpu: 0
    policy_evaluation: true
    g05_root: /share/mingyang/RoboDojo/XPolicyLab/policy/G05/GalaxeaVLA
    g05_processor_path: /share/mingyang/RoboDojo/XPolicyLab/policy/G05/GalaxeaVLA/checkpoints/qwen3_5_2b_base_processor

training:
  remote:
    enabled: false
    host: XYZ6226
    repo_root: /mnt/data-cpfs/mingyang/RoboDojo
    work_root: /mnt/data-cpfs/mingyang/RoboDojo/recap_remote_jobs
    zstd: /usr/bin/zstd
    conda: /mnt/data-cpfs/mingyang/miniconda3/bin/conda
    python: /mnt/data-cpfs/mingyang/miniconda3/envs/RoboDojo/bin/python
    policy_python: /mnt/data-cpfs/mingyang/RoboDojo/XPolicyLab/policy/G05/GalaxeaVLA/.venv/bin/python
    wcm_python: /mnt/data-cpfs/mingyang/RoboDojo/external_dependencies/WCM/.venv/bin/python
    policy_gpus: [0, 1, 2, 3]
    wcm_gpus: [0, 1, 2, 3]
    value_video_gpu: 0
    render_value_video: true

wcm:
  train:
    config: configs/wcm/robodojo_pi05.yaml
    epochs: 5
    replay_episodes: 44
    per_device_batch_size: 64
    num_workers: 8
    precision: fp32
    learning_rate: null
    warmup_steps: null
    video_decoder: pyav
  inference:
    batch_size: 96
    num_workers: 8
    device: cuda

recap:
  lookahead: 10
  gamma: 1.0
  failure_penalty: 300
  positive_fraction: 0.3
  unconditional_probability: 0.1
  guidance_scale: 1.0
  sampling:
    demonstrations: 1.0
    rollouts: 1.0

g05:
  root: /mnt/cpfs-E/mingyang/RoboDojo/XPolicyLab/policy/G05/GalaxeaVLA
  task_config: robodojo_recap
  processor_path: checkpoints/qwen3_5_2b_base_processor
  action_tokenizer: null
  action_source: fm
  steps: 5000
  batch_size: 8
  num_workers: 8
  grad_accumulation_steps: 16
  # GalaxeaVLA currently uses DDP, not FSDP. These are its native
  # per-rank memory controls; activation checkpointing trades compute for memory.
  memory:
    model_weights_to_bf16: false
    use_8bit_optimizer: false
    activation_checkpointing:
      vision: true
      vlm: true
      action_expert: true
  wandb_enabled: false
  optimizer:
    learning_rate: 1.0e-5
    warmup_steps: 500
    decay_learning_rate: 1.0e-8
    decay_start_ratio: 0.2
    weight_decay: 0.0001

evaluation:
  interval: 2000
  episodes: 20
  reuse_rollout: true
  layout_seed: 1
  layout_offset: 0

value_video:
  episodes: 3
  batch_size: 96
  device: cuda
  precision: fp32
  backend: auto
  speed: 1.0
  y_min: -1.0
  y_max: 1.0

runtime:
  policy_python: /mnt/cpfs-E/mingyang/RoboDojo/XPolicyLab/policy/G05/GalaxeaVLA/.venv/bin/python
  data_python: XPolicyLab/policy/Pi_05/openpi/.venv/bin/python
  wcm_python: /mnt/cpfs-E/mingyang/miniconda3/envs/RoboDojo/bin/python
  policy_dir: null
