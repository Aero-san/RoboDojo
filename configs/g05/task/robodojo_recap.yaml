# @package _global_
defaults:
- override /model: g05
- override /tokenizer: actioncodec
- override /data: robodojo_recap
- _self_

datastatics_path: ${oc.env:ROBODOJO_G05_DATA_STATS}

model:
  use_torch_compile: false
  use_8bit_optimizer: false
  batch_size: 8
  max_epochs: null
  max_steps: 3000
  learning_rate: 1.0e-5
  weight_decay: 0.01
  warmup_steps: 500
  lr_scheduler_type: warmup_constant_cosine
  lr_min_ratio: 0.1
  constant_end_ratio: 0.5
  num_workers: 8
  find_unused_parameters: true
  model_arch:
    action_dim: 20
    proprio_dim: 20
    checkpoint_vlm: true
    checkpoint_action_expert: true
    checkpoint_vision: true
    discrete_action: false
    continuous_action: true
    return_continuous_action: true
    fm:
      joint_training: true
      fm_weight: 1.0
      num_flow_samples: 8
    ar:
      ce_weight: 0.0
    processor:
      num_output_cameras: 3
      num_input_cameras: 3
      camera_size_config:
        exterior: [256, 256]
        wrist_left: [256, 256]
        wrist_right: [256, 256]
      tokenizer_params:
        local_files_only: true
  processor:
    num_output_cameras: 3
    num_input_cameras: 3
    camera_size_config:
      exterior: [256, 256]
      wrist_left: [256, 256]
      wrist_right: [256, 256]
    tokenizer_params:
      local_files_only: true

logger:
  type: wandb
  mode: online
